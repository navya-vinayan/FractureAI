{% extends "base.html" %}{% block title %}Create account | FractureAI{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card"><div class="auth-symbol">✚</div><div class="eyebrow">PATIENT WORKSPACE</div><h1>Create your account</h1><p class="muted">Set up a private demo account for this local application.</p>
<form method="post" class="form">
<label>Full name<input type="text" name="name" required placeholder="Your name"></label>
<label>Email address<input type="email" name="email" required placeholder="you@example.com"></label>
<label>Password<input type="password" name="password" minlength="8" required placeholder="At least 8 characters"></label>
<button class="btn primary full" type="submit">Create account</button>
</form><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></div>
{% endblock %}
